[project]
name = "lesson-loop"
version = "0.1.0"
description = "A self-evaluating beginner lesson generator"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "google-genai>=1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/lessonloop"]
